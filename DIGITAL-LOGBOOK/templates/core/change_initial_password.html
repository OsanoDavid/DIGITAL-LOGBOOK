{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Your Password | Kisii University Digital Logbook</title>
    <link rel="stylesheet" href="{% static 'css/portal.css' %}">
</head>
<body>
    <main style="max-width:520px; margin:56px auto; padding:28px; background:#ffffff; border-radius:12px; box-shadow:0 20px 60px rgba(15,23,42,0.12);">
        <h1 style="margin-top:0;">Set your new password</h1>
        <p>Your temporary password can only be used once. Create a password that only you know to continue to your workspace.</p>
        {% if error %}<p style="padding:12px; border-radius:8px; background:#fef2f2; color:#991b1b;">{{ error }}</p>{% endif %}
        <form method="post" style="display:grid; gap:16px;">
            {% csrf_token %}
            <label style="display:grid; gap:6px; font-weight:700;">New password
                <input type="password" name="password" autocomplete="new-password" required>
            </label>
            <label style="display:grid; gap:6px; font-weight:700;">Confirm new password
                <input type="password" name="confirm_password" autocomplete="new-password" required>
            </label>
            <button type="submit" class="btn btn-blue">Save New Password</button>
        </form>
    </main>
</body>
</html>
