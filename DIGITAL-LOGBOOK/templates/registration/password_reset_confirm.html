{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password</title>
  <link rel="stylesheet" href="{% static 'css/portal.css' %}">
</head>
<body>
  <main style="max-width:520px; margin:48px auto; padding:24px; background:#ffffff; border-radius:20px; box-shadow:0 28px 80px rgba(15,23,42,0.08);">
    <h1>Reset Password</h1>
    <p>Enter a new password for your account.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-blue">Set New Password</button>
    </form>
  </main>
</body>
</html>
