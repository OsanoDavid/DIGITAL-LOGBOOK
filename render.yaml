services:
  - type: web
    name: digital-logbook
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT sist_project.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: sist_project.settings
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: WEB_CONCURRENCY
        value: 2
      - key: DATABASE_URL
        fromDatabase:
          name: dhangongo
          property: connectionString
      - key: RENDER
        value: "true"

databases:
  - name: dhangongo
    plan: free
    databaseName: digital_logbook
    user: digital_logbook
