  <script>
    // Evaluates fee balance to dynamically unlock or lock the Next button
    function student_evaluateFeesClearance() {
      const feesStatus = document.getElementById('student_fees_status').value;
      const nextBtn = document.getElementById('student_step1NextBtn');
      
      if (feesStatus === "cleared") {
        nextBtn.removeAttribute("disabled");
      } else {
        nextBtn.setAttribute("disabled", "true");
      }
    }

    function student_handleOrganizationSelect(value) {
      const customInput = document.getElementById('student_organization_custom');
      if (!customInput) return;
      if (value === 'OTHER') {
        customInput.style.display = 'block';
        customInput.required = true;
      } else {
        customInput.style.display = 'none';
        customInput.required = false;
        customInput.value = '';
      }
    }

    function student_prepareOrganizationValue() {
      const orgSelect = document.getElementById('student_organization');
      const customInput = document.getElementById('student_organization_custom');
      if (!orgSelect) return;
      if (orgSelect.value === 'OTHER' && customInput && customInput.value.trim()) {
        orgSelect.value = customInput.value.trim();
      }
    }

    // Visibility toggle functionality logic
    function student_toggleFieldPassword(inputId, triggerBtn) {
      const passInput = document.getElementById(inputId);
      passInput.type = passInput.type === 'password' ? 'text' : 'password';
      triggerBtn.textContent = passInput.type === 'password' ? '👁️' : '🙈';
    }

    // Validates inputs within the active container step card
    function student_validateStep(step) {
      student_prepareOrganizationValue();
      const stepDiv = document.getElementById("student_step" + step);
      const inputs = stepDiv.querySelectorAll("input[required], select[required]");
      for (let input of inputs) {
        if (!input.value.trim()) {
          input.style.borderColor = "#e74c3c";
          setTimeout(() => { input.style.borderColor = "#e2e8f0"; }, 2500);
          input.focus();
          return false;
        }
      }

      // Password checks inside step 1 
      if (step === 1) {
        const pass = document.getElementById('student_password').value;
        const confirmPass = document.getElementById('student_confirm_password').value;
        if (pass.length < 8) { alert('Password must be at least 8 characters long.'); return false; }
        if (pass !== confirmPass) { alert('Passwords do not match!'); return false; }
      }
      return true;
    }

    // Handles layout progress indicators
    function student_updateProgress(percent) {
      document.getElementById('student_progressBar').style.width = percent + "%";
    }

    // Navigates application form flow layers forwards
    function student_nextStep(step) {
      if (!student_validateStep(step)) return;

      const spinner = document.getElementById("student_spinner" + step);
      if(spinner) spinner.style.display = "inline-block";

      setTimeout(() => {
        if(spinner) spinner.style.display = "none";
        document.getElementById("student_step" + step).classList.remove("active");
        document.getElementById("student_step" + (step + 1)).classList.add("active");
        student_updateProgress(100);
      }, 400); 
    }

    // Navigates application form flow layers backwards
    function student_prevStep(step) {
      document.getElementById("student_step" + (step + 1)).classList.remove("active");
      document.getElementById("student_step" + step).classList.add("active");
      student_updateProgress(50);
    }

    // Compiles information and opens the overlay card interface
    function student_openReviewOverlay() {
      if (!student_validateStep(2)) return;

      const fields = [
        { id: "student_full_name", label: "Full Name" },
        { id: "student_reg_number", label: "Registration Number" },
        { id: "student_email", label: "Email Address" },
        { id: "student_phone", label: "Phone Number" },
        { id: "student_year", label: "Year of Study" },
        { id: "student_organization", label: "Organization Name" },
        { id: "student_fees_status", label: "Fees Status" },
        { id: "student_university", label: "University" },
        { id: "student_faculty", label: "Faculty" },
        { id: "student_department", label: "Department" },
        { id: "student_programme", label: "Course / Programme" },
        { id: "student_unit_name", label: "Unit Name" },
        { id: "student_unit_code", label: "Unit Code" }
      ];
      
      let reviewHTML = "<ul class='review-grid-list'>";
      fields.forEach(field => {
        const element = document.getElementById(field.id);
        let val = element ? element.value.trim() : "Not provided";
        if (!val) val = "Not provided";
        
        // Formatting readable value output for fees status dropdown
        if (field.id === "student_fees_status" && element) {
          val = element.value === "cleared" ? "Fully Cleared" : "Outstanding Balance";
        }

        reviewHTML += `<li><strong>${field.label}</strong> ${val}</li>`;
      });
      reviewHTML += "</ul>";
      
      document.getElementById('student_reviewOverlayContent').innerHTML = reviewHTML;
      document.getElementById('student_reviewOverlay').classList.add("show");
    }

    // Closes the overlay view modal
    function student_closeReviewOverlay() {
      document.getElementById('student_reviewOverlay').classList.remove("show");
    }

    // Submission configuration entry point
    function student_submitForm() {
      student_closeReviewOverlay();
      document.getElementById('student_registrationForm').requestSubmit();
    }
  </script>
