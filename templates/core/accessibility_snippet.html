{% load static %}
<!-- Accessibility Sidebar Snippet (v5 - Updated Design) -->
<link rel="stylesheet" href="{% static 'css/accessibility.css' %}">

<style>
    .theme-circle {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid white;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        transition: all 0.2s;
    }

    .theme-circle:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 12px rgba(0, 0, 0, 0.3);
    }

    .tc-red { background: linear-gradient(to bottom, #f44336, #b71c1c); }
    .tc-yellow { background: linear-gradient(to bottom, #ffeb3b, #fbc02d); }
    .tc-blue { background: linear-gradient(to bottom, #2196f3, #0d47a1); }
    .tc-default { background: #eeeeee; }

    .acc-divider {
        height: 1px;
        background: rgba(0, 0, 0, 0.06);
        margin: 20px 0;
    }

    /* Custom Flex and Grid Classes to avoid relying on external Bootstrap */
    .acc-flex-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .acc-flex-center { display: flex; align-items: center; justify-content: center; }
    .acc-inline-flex { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; flex-wrap: nowrap; }
    .acc-icon-box { background: #0d6efd; color: white; padding: 8px; border-radius: 8px; margin-right: 8px; display: flex; align-items: center; justify-content: center; }
    .acc-title-text { color: #212529; font-weight: bold; margin: 0; font-size: 1.1rem; }
    
    .acc-btn-primary { background: #212529; width: 100%; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: bold; border-radius: 8px; color: white; border: none; cursor: pointer; transition: background 0.2s; }
    .acc-btn-primary:hover { background: #343a40; }
    .acc-btn-outline { background: transparent; border: 2px solid #cbd5e1; width: 100%; padding: 10px; font-weight: bold; border-radius: 8px; color: #475569; cursor: pointer; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 5px; transition: background 0.2s; }
    .acc-btn-outline:hover { background: #f1f5f9; }
</style>

<!-- Premium 3-Color Glowing Spinner Loader -->
<div id="system-page-loader">
    <div class="loader-container">
        <span class="loader-text">KISII LOGBOOK</span>
        <!-- Arc 1: Red -->
        <svg class="loader-arc arc-1" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="44" stroke="#FF1744" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="55 220" />
        </svg>
        <!-- Arc 4: Green -->
        <svg class="loader-arc arc-4" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="38" stroke="#00C853" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="65 220" stroke-dashoffset="-70" />
        </svg>
        <!-- Arc 5: Blue -->
        <svg class="loader-arc arc-5" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="32" stroke="#00B0FF" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="40 200" stroke-dashoffset="-50" />
        </svg>
    </div>
</div>

<div id="accessibility-widget">
    <button id="accessibility-btn" onclick="toggleAccPanel()" title="Accessibility Settings">
        <i class="bi bi-gear-fill" id="acc-gear-icon"></i>
    </button>
</div>

<div id="accessibility-panel">
    <div class="acc-flex-between">
        <div class="acc-flex-center">
            <div class="acc-icon-box">
                <i class="bi bi-universal-access" style="font-size: 1.25rem;"></i>
            </div>
            <span class="acc-title-text">Accessibility</span>
        </div>
        <button onclick="toggleAccPanel()" class="btn-close-acc" title="Close Sidebar" id="acc-close-btn">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <!-- 1. Text Controls -->
    <div class="acc-section">
        <span class="acc-label text-primary" style="color: #0d6efd;">Font Scaling</span>
        <div class="acc-inline-flex">
            <button onclick="changeFontSize(-15)" style="flex:1; height:48px; font-size:1.8rem; line-height: 1; font-weight:900; background:#dc3545; color:white; border:none; border-radius:12px; cursor:pointer; box-shadow:0 3px 10px rgba(220,53,69,0.4); transition:transform 0.15s; display: flex; align-items: center; justify-content: center;" onmousedown="this.style.transform='scale(0.93)'" onmouseup="this.style.transform='scale(1)'">&#8722;</button>
            <div style="text-align:center; min-width:75px;">
                <div id="acc-font-display" style="font-size:1.3rem; font-weight:800; color:#0d6efd;">100%</div>
                <div style="font-size:0.65rem; color:#999; letter-spacing:1px; text-transform:uppercase;">Font Size</div>
            </div>
            <button onclick="changeFontSize(15)" style="flex:1; height:48px; font-size:1.8rem; line-height: 1; font-weight:900; background:#198754; color:white; border:none; border-radius:12px; cursor:pointer; box-shadow:0 3px 10px rgba(25,135,84,0.4); transition:transform 0.15s; display: flex; align-items: center; justify-content: center;" onmousedown="this.style.transform='scale(0.93)'" onmouseup="this.style.transform='scale(1)'">+</button>
        </div>
    </div>

    <div class="acc-divider"></div>

    <!-- 2. Intelligence Section -->
    <div class="acc-section">
        <span class="acc-label text-primary" style="color: #0d6efd;">Voice-First Navigation</span>
        <button class="acc-btn-primary" onclick="startVoiceAssistant()">
            <i class="bi bi-mic-fill" style="color: #0dcaf0;"></i> Engage Voice Engine
        </button>
    </div>

    <div class="acc-divider"></div>

    <!-- 3. Reading Tools -->
    <div class="acc-section">
        <span class="acc-label text-primary" style="color: #0d6efd;">Reading Assistance</span>
        <div class="acc-grid">
            <div class="acc-option py-3" style="padding: 1rem 0;" onclick="toggleAccSetting('dyslexic')">
                <i class="bi bi-fonts" style="display:block; margin-bottom:6px; font-size: 1.2rem;"></i> Dyslexic
            </div>
            <div class="acc-option py-3" style="padding: 1rem 0;" onclick="location.reload()">
                <i class="bi bi-arrow-clockwise" style="display:block; margin-bottom:6px; font-size: 1.2rem;"></i> Reset
            </div>
        </div>
    </div>

    <div class="acc-divider"></div>

    <!-- Font Family Selector -->
    <div class="acc-section">
        <span class="acc-label text-primary" style="color: #0d6efd;">Font Family</span>
        <select class="form-select shadow-sm" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ced4da; font-size: 0.9rem;" onchange="changeFont(this.value)">
            <option value="">— Default System Font —</option>
            <option value="'Arial', sans-serif">Arial (Clean)</option>
            <option value="'Georgia', serif">Georgia (Serif)</option>
            <option value="'Courier New', monospace">Courier New (Mono)</option>
            <option value="'Verdana', sans-serif">Verdana (Wide)</option>
            <option value="'Trebuchet MS', sans-serif">Trebuchet (Rounded)</option>
            <option value="'Comic Sans MS', cursive">Comic Sans (Dyslexia)</option>
            <option value="'Times New Roman', serif">Times New Roman</option>
        </select>
    </div>

    <div class="acc-divider"></div>

    <!-- Visual Display Options -->
    <div class="acc-section">
        <span class="acc-label text-primary" style="color: #0d6efd;">Visual Display Options</span>
        <div class="acc-grid">
            <div class="acc-option py-3" style="padding: 1rem 0;" onclick="toggleDisplayMode('dark')" id="btn-dark">
                <i class="bi bi-moon-stars-fill" style="display:block; margin-bottom:6px; font-size: 1.2rem;"></i> Dark Mode
            </div>
            <div class="acc-option py-3" style="padding: 1rem 0;" onclick="toggleDisplayMode('contrast')" id="btn-contrast">
                <i class="bi bi-circle-half" style="display:block; margin-bottom:6px; font-size: 1.2rem;"></i> High Contrast
            </div>
            <div class="acc-option py-3" style="padding: 1rem 0;" onclick="toggleDisplayMode('grayscale')" id="btn-gray">
                <i class="bi bi-palette2" style="display:block; margin-bottom:6px; font-size: 1.2rem;"></i> Greyscale
            </div>
            <div class="acc-option py-3" style="padding: 1rem 0;" onclick="toggleDisplayMode('sepia')" id="btn-sepia">
                <i class="bi bi-brightness-high" style="display:block; margin-bottom:6px; font-size: 1.2rem;"></i> Warm Sepia
            </div>
        </div>
    </div>

    <div style="margin-top: auto;">
        <!-- 4. Themes -->
        <div class="acc-section" style="border-top: 1px solid rgba(0,0,0,0.08); padding-top: 1.5rem;">
            <span class="acc-label text-primary text-center" style="color: #0d6efd; text-align: center;">Interface Themes</span>
            <div class="acc-flex-center" style="gap: 18px;">
                <div class="theme-circle tc-default" onclick="setTheme('default')" title="Standard"></div>
                <div class="theme-circle tc-red" onclick="setTheme('red')" title="Red Mode"></div>
                <div class="theme-circle tc-yellow" onclick="setTheme('yellow')" title="Yellow Mode"></div>
                <div class="theme-circle tc-blue" onclick="setTheme('blue')" title="Blue Mode"></div>
            </div>
        </div>

        <button class="acc-btn-outline" onclick="toggleAccPanel()">
            <i class="bi bi-x-circle"></i> Close Sidebar
        </button>
    </div>
</div>

<div id="voice-overlay">
    <div class="voice-wave"></div>
    <h2 style="margin-top: 2rem; font-weight: bold;" id="voice-status">Analyzing Voice Input...</h2>
</div>

<script src="{% static 'js/accessibility.js' %}"></script>
