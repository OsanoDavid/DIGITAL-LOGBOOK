{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset</title>
  <link rel="stylesheet" href="{% static 'css/portal.css' %}">
</head>
<body>
  <main style="max-width:520px; margin:48px auto; padding:24px; background:#ffffff; border-radius:20px; box-shadow:0 28px 80px rgba(15,23,42,0.08);">
    <h1>Password Reset</h1>
    <p>Enter the email address associated with your account. We will send a link to reset your password.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-blue">Send Reset Link</button>
    </form>
    <p style="margin-top:16px;"><a href="{% url 'login' %}">Back to login</a></p>
  </main>
</body>
</html>
